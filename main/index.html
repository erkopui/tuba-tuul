<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Fans</title>
<style>
body { font-family: sans-serif; max-width: 34em; margin: 1em auto; padding: 0 1em }
.fan { display: flex; align-items: center; gap: .5em; margin: .7em 0 }
.fan span { width: 3em }
.fan input { flex: 1; min-width: 5em }
.fan b { width: 2.2em; text-align: right }
button { padding: .3em .6em }
input[type=number] { width: 6em }
textarea { width: 100%; box-sizing: border-box; font-family: monospace }
pre { background: #eee; padding: .5em; white-space: pre-wrap; min-height: 1.2em }
</style>

<h2>Fans</h2>
<p>Fade <input id=fade type=number min=0 max=40000 step=500 placeholder=default> ms for 0 to 100 %
<div id=fans></div>
<button id=refresh>Refresh</button>
<pre id=log></pre>

<h2>WiFi</h2>
<p><button id=scan>Scan</button> <select id=nets hidden></select>
<p><input id=ssid placeholder=SSID> <input id=pass type=password placeholder=Password>
<button id=save>Save and reboot</button>

<h2>VPN</h2>
<p>WireGuard: <b id=vpn></b>
<p><textarea id=conf rows=8 autocomplete=off spellcheck=false placeholder="[Interface]
PrivateKey = ...
Address = 10.0.0.2/24

[Peer]
PublicKey = ...
Endpoint = vpn.example.com:51820"></textarea>
<p><button id=vpnsave>Save</button> <button id=vpnoff>Remove</button>

<h2>Firmware</h2>
<p>Running: <b id=fw></b>
<p><input id=fwfile type=file accept=.bin> <button id=fwsend>Update</button>

<script>
var rows = []

// Send a request and show it with the answer in the log line. Of the body
// only the first line is shown, or the text given in its place.
function post(path, body, method, shown) {
	method = method || 'POST'
	var line = method + ' ' + path + '  ' + (shown || body.split('\n')[0])
	log.textContent = line
	return fetch(path, { method: method, body: body }).then(function(res) {
		return res.text().then(function(text) {
			log.textContent = line + '\n' + res.status + '  ' + text
			return res.ok ? text : null
		})
	}).catch(function(err) {
		log.textContent = line + '\n' + err
	})
}

function loadVpn() {
	fetch('/api/vpn').then(function(res) { return res.json() }).then(function(status) {
		vpn.textContent = status.state + '  ' + status.tunnel
	}).catch(function() {
		vpn.textContent = '?'
	})
}

function loadFw() {
	return fetch('/api/ota').then(function(res) { return res.json() }).then(function(info) {
		fw.textContent = info.version + '  ' + info.board + '  ' + info.slot
		return info.slot
	})
}

function load() {
	loadVpn()
	loadFw().catch(function() { fw.textContent = '?' })
	return fetch('/api/fans').then(function(res) { return res.json() }).then(show)
}

function show(list) {
	list.forEach(function(pct, i) {
		var row = rows[i] || (rows[i] = add(i + 1, 'Fan ' + (i + 1)))
		row.range.value = row.val.textContent = pct
	})
}

function set(id, pct) {
	var query = fade.value === '' ? '' : '?fade=' + fade.value
	post('/api/fans/' + id + query, '' + pct).then(function(text) {
		if (text) show(JSON.parse(text))
		else load()
	})
}

function add(id, name) {
	var el = document.createElement('div')
	el.className = 'fan'
	el.innerHTML = '<span>' + name + '</span><input type=range max=100 value=0><b>0</b>%' +
		'<button>0</button><button>50</button><button>100</button>'
	var range = el.children[1], val = el.children[2]
	range.oninput = function() { val.textContent = range.value }
	range.onchange = function() { set(id, range.value) }
	el.querySelectorAll('button').forEach(function(btn) {
		btn.onclick = function() {
			range.value = val.textContent = btn.textContent
			set(id, btn.textContent)
		}
	})
	fans.appendChild(el)
	return { range: range, val: val }
}

refresh.onclick = load
scan.onclick = function() {
	scan.textContent = 'Scanning...'
	fetch('/api/wifi/scan').then(function(res) {
		if (!res.ok) throw 'scan failed, try again'
		return res.json()
	}).then(function(list) {
		nets.textContent = ''
		nets.add(new Option(list.length + ' networks, pick one', ''))
		list.forEach(function(net) {
			nets.add(new Option(net.ssid + '  (' + net.rssi + ' dBm)', net.ssid))
		})
		nets.hidden = false
	}).catch(function(err) {
		log.textContent = 'GET /api/wifi/scan\n' + err
	}).then(function() {
		scan.textContent = 'Scan'
	})
}
nets.onchange = function() {
	if (nets.value) ssid.value = nets.value
	pass.focus()
}
save.onclick = function() { post('/api/wifi', ssid.value + '\n' + pass.value) }
// The tunnel switches over a moment after the answer, so look twice.
function vpnChanged() {
	setTimeout(loadVpn, 3000)
	setTimeout(loadVpn, 10000)
}
vpnsave.onclick = function() {
	post('/api/vpn', conf.value, 'POST', '(config)').then(function(text) {
		if (text) conf.value = ''
		vpnChanged()
	})
}
vpnoff.onclick = function() { post('/api/vpn', '', 'DELETE').then(vpnChanged) }
// After an update the board reboots into the other slot. Ask until it
// answers again; the same slot as before means the new firmware did not start.
function fwWait(line, slot) {
	setTimeout(function() {
		loadFw().then(function(now) {
			log.textContent = line + '\n' + (now == slot ? 'the new firmware did not start, the previous one is running'
			                                             : 'the new firmware is running')
			load()
		}).catch(function() { fwWait(line, slot) })
	}, 2000)
}
fwsend.onclick = function() {
	var file = fwfile.files[0]
	if (!file) return
	var line = 'POST /api/ota  ' + file.name
	loadFw().then(function(slot) {
		var req = new XMLHttpRequest()
		req.open('POST', '/api/ota')
		req.upload.onprogress = function(ev) {
			log.textContent = line + '\n' + Math.round(100 * ev.loaded / ev.total) + ' %'
		}
		req.onload = function() {
			log.textContent = line + '\n' + req.status + '  ' + req.responseText
			if (req.status == 200) fwWait(log.textContent, slot)
		}
		req.onerror = function() { log.textContent = line + '\nupload failed' }
		req.send(file)
	}).catch(function() { log.textContent = line + '\nthe board does not answer' })
}
load().then(function() { add('all', 'All') })
</script>
